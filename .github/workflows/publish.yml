name: Publish to npm

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # OIDC passwordless publish via Trusted Publisher (no NPM_TOKEN needed).
      # `id-token: write` above lets Actions mint an OIDC token that npm verifies
      # against the Trusted Publisher configured for this package on npmjs.com.
      - name: Publish
        run: npm publish --access public --provenance
